name: lovespin

services:
  db:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lovespin
      POSTGRES_USER: lovespin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovespin -d lovespin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: justours/lovespin:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lovespin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/lovespin
      UPLOAD_DIR: /data/uploads
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set IP_HASH_SECRET}
    volumes:
      - uploads:/data/uploads
    networks:
      backend:
      edge:
        aliases:
          - spin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

  cleanup:
    image: justours/lovespin:${IMAGE_TAG:-latest}
    command: ["sh", "-c", "while true; do node scripts/cleanup.mjs; sleep 3600; done"]
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lovespin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/lovespin
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    networks:
      - backend

networks:
  backend:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK:-justours-edge}

volumes:
  postgres_data:
  uploads:

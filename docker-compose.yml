services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lovespin
      POSTGRES_USER: lovespin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lovespin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovespin -d lovespin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: lovespin-app:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lovespin:${POSTGRES_PASSWORD:-lovespin}@db:5432/lovespin
      UPLOAD_DIR: /data/uploads
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  cleanup:
    image: lovespin-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lovespin:${POSTGRES_PASSWORD:-lovespin}@db:5432/lovespin
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    command: ["sh", "-c", "while true; do node scripts/cleanup.mjs; sleep 3600; done"]

volumes:
  postgres_data:
  uploads:
